[package]
name = "spar"
version = "0.6.0"
edition = "2021"
description = "A statically typed scripting language with native configuration and task automation"
license = "MIT"
repository = "https://github.com/oraclevs/spar"
keywords = ["configuration", "config", "language", "json", "spar"]
categories = ["config", "parser-implementations", "command-line-utilities"]

[lib]
name = "spar"
path = "src/lib.rs"

[[bin]]
name = "spar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
tempfile = "3"
semver = "1"
sha2 = "0.10"
spar-command = { path = "../spar-command" }
spar-process = { path = "../spar-process" }
scoc = { path = "../scoc" }

indexmap = "2"
regex = "1"
ureq = "2"
getrandom = "0.2"
