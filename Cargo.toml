[package]
name = "spar"
version = "0.6.4"
edition = "2021"
description = "A statically typed scripting language with native configuration and task automation"
license = "MIT"
repository = "https://github.com/oraclevs/spar"
keywords = ["configuration", "config", "language", "json", "spar"]
categories = ["config", "parser-implementations", "command-line-utilities"]

[lib]
name = "spar"
path = "src/lib.rs"

[[bin]]
name = "spar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
tempfile = "3"
semver = "1"
sha2 = "0.10"
spar-command = { path = "../spar-command", version = "0.1.0" }
spar-process = { path = "../spar-process", version = "0.1.0" }
scoc = { path = "../scoc", version = "0.1.0" }
spar-native-sys = { path = "../spar-native-sys", version = "0.0.1" }

indexmap = "2"
regex = "1"
ureq = "2"
getrandom = "0.2"

[features]
# Developer-only allocation counters printed by `spar exec`.
runtime-stats = []
# Developer-only sampling profiler: SPAR_PROFILE=1 spar exec ... prints hot symbols.
profile = ["dep:pprof"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1"
libloading = "0.9"
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-jit = "0.136"
cranelift-module = "0.136"
cranelift-native = "0.136"

[target.'cfg(target_os = "linux")'.dependencies]
pprof = { version = "0.14", optional = true }
